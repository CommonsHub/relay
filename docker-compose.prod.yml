services:
  strfry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commonshub-relay
    restart: unless-stopped
    volumes:
      - relay-data:/data
    environment:
      - ALLOWLIST_PATH=/data/allowlist.json
    networks:
      - coolify

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: commonshub-relay-admin
    restart: unless-stopped
    volumes:
      - relay-data:/data
    environment:
      - RELAY_ADMIN_SECRET=${RELAY_ADMIN_SECRET}
      - ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS:-0.0.0.0}
      - ALLOWLIST_PATH=/data/allowlist.json
      - ADMIN_PORT=3000
    networks:
      - coolify

volumes:
  relay-data:

networks:
  coolify:
    external: true
