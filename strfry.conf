##
## Commons Hub strfry config
##

db = "/data/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777

    nofiles = 1000000

    # Set by reverse proxy (nginx/Coolify)
    realIpHeader = "x-forwarded-for"

    auth {
        enabled = true
        serviceUrl = "wss://relay.commonshub.brussels"
    }

    info {
        name = "Commons Hub"
        description = "Nostr relay for the Commons Hub community. Reads are open, writes are restricted to community members."
        pubkey = ""
        contact = "hello@commonshub.brussels"
        icon = ""
        banner = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200

    writePolicy {
        plugin = "/app/plugins/write-policy.js"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
