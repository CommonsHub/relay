# nginx config for relay.commonshub.brussels
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/

upstream strfry {
    server 127.0.0.1:7777;
}

upstream relay_admin {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name relay.commonshub.brussels;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relay.commonshub.brussels;

    # SSL certs (managed by certbot or Coolify)
    ssl_certificate /etc/letsencrypt/live/relay.commonshub.brussels/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.commonshub.brussels/privkey.pem;

    # Admin API — IP restricted
    location /admin/ {
        # Restrict to CommonsHub API server IP
        # allow <API_SERVER_IP>;
        # deny all;

        proxy_pass http://relay_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://relay_admin;
    }

    # Everything else → strfry (websocket)
    location / {
        proxy_pass http://strfry;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
